name: lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke | tools | trial-super"
        required: true
        default: smoke
      firmware_url:
        description: "Firmware tgz URL"
        required: false
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.303.0.WGUINXM/flame_in_global_images_OS3.0.303.0.WGUINXM_20261010.0000.00_16.0_in_a8222f7a67.tgz"
      test_size_gb:
        description: "Smoke: size of the round-trip test artifact in GB"
        required: false
        default: "3"

jobs:
  smoke:
    if: ${{ inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Machine info (before cleanup)
        run: |
          echo "== cpu/mem"; nproc; free -g
          echo "== df before"; df -h /
      - name: Cleanup preinstalled software
        run: |
          bash ci/free_space.sh
      - name: Generate round-trip test file
        env:
          GB: ${{ inputs.test_size_gb }}
        run: |
          mkdir -p rt
          head -c "${GB}G" /dev/urandom > rt/test.bin
          sha256sum rt/test.bin | tee rt/test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: roundtrip
          path: rt/
          compression-level: 0
          retention-days: 1

  tools:
    if: ${{ inputs.mode == 'tools' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/setup_tools.sh

  extract:
    if: ${{ inputs.mode == 'extract' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free space
        run: bash ci/free_space.sh
      - name: Setup tools
        run: bash ci/setup_tools.sh
      - name: Extract bundle
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/extract.sh "$URL"
      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.tar.gz
          compression-level: 0
          retention-days: 3

  jadx2:
    if: ${{ inputs.mode == 'jadx2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: JADX second target set
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/jadx_job.sh "$URL" analysis/jadx_targets2.txt jadx_out2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jadx2
          path: jadx_out2.tar
          compression-level: 0
          retention-days: 3

  jadx3:
    if: ${{ inputs.mode == 'jadx3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: JADX services.jar
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/jadx_job.sh "$URL" analysis/jadx_targets3.txt jadx_out3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jadx3
          path: jadx_out3.tar
          compression-level: 0
          retention-days: 3

  recovery:
    if: ${{ inputs.mode == 'recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/setup_tools.sh
      - name: Recovery strings
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/recovery_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery
          path: recovery_out.tar.gz
          compression-level: 0
          retention-days: 3

  wizard:
    if: ${{ inputs.mode == 'wizard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: Wizard APKs with resources
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/wizard_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wizard
          path: wizard_out.tar.gz
          compression-level: 0
          retention-days: 3

  certs:
    if: ${{ inputs.mode == 'certs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: Signing certificate map
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/certs_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certs
          path: certs_out.tar.gz
          compression-level: 0
          retention-days: 3

  provision:
    if: ${{ inputs.mode == 'provision' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: Provision with resources
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/provision_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provision
          path: provision_out.tar.gz
          compression-level: 0
          retention-days: 3

  strings:
    if: ${{ inputs.mode == 'strings' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: Find the Unsupported-software text
        env:
          URL: ${{ inputs.firmware_url }}
          SKIP_IMG: '1'
        run: bash ci/strings_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strings
          path: strings_out.tar.gz
          compression-level: 0
          retention-days: 3

  apex:
    if: ${{ inputs.mode == 'apex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: APEX unpack and scan
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/apex_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex
          path: bundle_apex.tar.gz
          compression-level: 0
          retention-days: 3

  jadx:
    if: ${{ inputs.mode == 'jadx' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free_space.sh
      - run: bash ci/setup_tools.sh
      - name: JADX targets
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/jadx_job.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jadx
          path: jadx_out.tar
          compression-level: 0
          retention-days: 3

  boot:
    if: ${{ inputs.mode == 'boot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup tools
        run: bash ci/setup_tools.sh
      - name: Boot chain
        env:
          URL: ${{ inputs.firmware_url }}
        run: bash ci/boot_only.sh "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot
          path: bundle_boot.tar.gz
          compression-level: 0
          retention-days: 3

  trial-super:
    if: ${{ inputs.mode == 'trial-super' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free space
        run: bash ci/free_space.sh
      - name: Setup tools
        run: bash ci/setup_tools.sh
      - name: Trial
        env:
          URL: ${{ inputs.firmware_url }}
        run: |
          export PATH="$HOME/lab-bin:$PATH"
          bash ci/trial_super.sh "$URL"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-super-report
          path: report/
          retention-days: 3
